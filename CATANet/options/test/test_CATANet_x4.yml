# general settings
name: test_CATANet_x4
model_type: CATANetModel
scale: 4
num_gpu: 1
manual_seed: 3407

datasets:
  test_1:  # the 1st test dataset
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /hy-tmp/TestDataSR/HR/Set5/x4
    dataroot_lq: /hy-tmp/TestDataSR/LR/LRBI/Set5/x4
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_2:  # the 2nd test dataset
    name: Set14
    type: PairedImageDataset
    dataroot_gt: /hy-tmp/TestDataSR/HR/Set14/x4
    dataroot_lq: /hy-tmp/TestDataSR/LR/LRBI/Set14/x4
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_3:  # the 3rd test dataset
    name: B100
    type: PairedImageDataset
    dataroot_gt: /hy-tmp/TestDataSR/HR/B100/x4
    dataroot_lq: /hy-tmp/TestDataSR/LR/LRBI/B100/x4
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_4:  # the 4th test dataset
    name: Urban100
    type: PairedImageDataset
    dataroot_gt: /hy-tmp/TestDataSR/HR/Urban100/x4
    dataroot_lq: /hy-tmp/TestDataSR/LR/LRBI/Urban100/x4
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_5:  # the 5th test dataset
    name: Manga109
    type: PairedImageDataset
    dataroot_gt: /hy-tmp/TestDataSR/HR/Manga109/x4
    dataroot_lq: /hy-tmp/TestDataSR/LR/LRBI/Manga109/x4
    filename_tmpl: '{}'
    io_backend:
      type: disk



# network structures
network_g:
  type: CATANet
  upscale: 4

# path
path:
  # x4 finetune 统一报告 checkpoint 候选（逐个切换跑全 5 基准后定单点，禁逐集挑最优）：
  #   net_g_195000.pth —— Set5 PSNR 全局最强
  #   net_g_240000.pth —— Set14 PSNR 全局最强、后期点
  #   net_g_250000.pth —— 最新稳定点，Set5 SSIM 并列最强
  pretrain_network_g: experiments/train_CATANet_x4_finetune/models/net_g_195000.pth
  strict_load_g: true
  results_root: results/CATANet

# validation settings
val:
  save_img: true
  suffix: CATANet  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr_pt
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim_pt
      crop_border: 4
      test_y_channel: true
